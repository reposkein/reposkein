name: Live demo (GitHub Pages)

# Builds a self-contained static export of the RepoSkein constellation viewer
# over RepoSkein's OWN graph (a real, multi-language Rust+TS codebase) and
# publishes it to GitHub Pages, so the README can link a live interactive demo.
#
# A thin caller of the reusable publish-pages.yml workflow: downloads a
# RELEASED reposkein-indexer binary (no Rust toolchain build here) and runs
# `reposkein-mcp view --export`. See docs/HOSTING.md ("Host your
# constellation") for the general-purpose version any repo can adopt via
# `reposkein-mcp init --ci`.
#
# ONE-TIME SETUP (repo owner): Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Until that's enabled, the deploy job fails (the
# build job still produces the artifact).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow one concurrent deploy; don't cancel an in-progress one (let it finish).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# Opt node20-declaring actions into the Node 24 runtime ahead of GitHub's
# forced migration (matches ci.yml / release.yml / embed-server.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    uses: ./.github/workflows/publish-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      repo-path: "."
