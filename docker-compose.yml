# Optional supporting services for RepoSkein, in one command:
#
#   docker compose up -d                 # the local embedding server (for hybrid semantic_find)
#   docker compose --profile neo4j up -d # also start the optional Neo4j backend
#
# NOTE: the RepoSkein MCP server itself runs over **stdio**, launched by your
# agent (Claude Code / Cursor / …) — it is not a long-running container. This
# compose brings up the *services the MCP server talks to*; you then point the
# MCP server at them with env vars (shown below).
#
# Works on Linux, macOS, and Windows (Docker Desktop). CPU-only by default — runs
# on Apple Silicon / ARM unified-memory and GPU-less Linux. Docker cannot use
# Apple's Metal/MPS; for that, run embed-server natively (see embed-server/README.md).
# NVIDIA GPU: uncomment the `deploy` block under `embed`.
services:
  # Local embedding server for the optional hybrid tier of `semantic_find`.
  # Point the MCP server at it:
  #   REPOSKEIN_EMBED_PROVIDER=http
  #   REPOSKEIN_EMBED_URL=http://127.0.0.1:8080/v1/embeddings
  #   REPOSKEIN_EMBED_MODEL=voyage-4-nano
  #   REPOSKEIN_EMBED_DIMS=1024          # must equal EMBED_DIMS below
  embed:
    # Prebuilt multi-arch image (amd64 + arm64). To use it without building:
    #   docker compose pull embed && docker compose up -d
    # Plain `docker compose up` builds locally from ./embed-server instead.
    image: ghcr.io/reposkein/reposkein-embed:latest
    build: ./embed-server
    # Hard ceiling. Without it the container can consume the whole Docker VM —
    # on a stock Docker Desktop install that is ~8 GiB shared with Neo4j, and
    # the host stalls long before you see an error.
    mem_limit: 3g
    ports:
      # Bind to localhost only by default — the embed server is a local helper,
      # not a service to expose on the LAN. To expose on all interfaces
      # (e.g. a shared dev machine), change to "8080:8080".
      - "127.0.0.1:8080:8080"
    environment:
      EMBED_MODEL: voyageai/voyage-4-nano
      EMBED_DIMS: "1024" # voyage-4-nano Matryoshka: 2048 | 1024 | 512 | 256
      # HF_TOKEN: "<token>"          # only for gated/private models
      # Bound the math libraries. Left unset, they spawn one thread per core and
      # glibc opens an arena per thread — memory that scales with your CPU count
      # for no throughput gain on a request this small.
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - hf-cache:/home/app/.cache/huggingface # persist the model across restarts
    restart: unless-stopped
    # NVIDIA GPU only (Docker can't use Apple Silicon Metal). Uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - { driver: nvidia, count: 1, capabilities: [gpu] }

  # Optional Neo4j backend (most users don't need it — committed JSONL is the
  # zero-infra default). Enable with:  docker compose --profile neo4j up -d
  # Then set on the MCP server: REPOSKEIN_STORE=neo4j, NEO4J_URI=neo4j://localhost:7687,
  # NEO4J_USER=neo4j, NEO4J_PASSWORD=reposkeintest.
  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    # The Neo4j docker image pins only the page cache; heap is left to JVM
    # ergonomics, which take 25% of whatever RAM the container can see. With no
    # limit that is the entire Docker VM. Both numbers are set explicitly below,
    # and mem_limit makes the JVM read the cgroup rather than the VM.
    #
    # RepoSkein's graph is small (a 200k-node repo is ~130 MB on disk), so 1G
    # heap / 512M page cache is generous. For a dedicated box, generate your own:
    #   neo4j-admin server memory-recommendation --memory=8g --docker
    mem_limit: 2g
    environment:
      NEO4J_AUTH: neo4j/reposkeintest
      # initial == max: no full GC just to resize the heap.
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      # Per-transaction ceilings. The importer writes in chunks, but a hand-written
      # Cypher query should fail loudly rather than take the container with it.
      NEO4J_dbms_memory_transaction_total_max: 512M
      NEO4J_db_memory_transaction_max: 256M
      # Die on heap exhaustion instead of thrashing the GC indefinitely — a
      # restarted container is recoverable, a wedged one is not.
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  hf-cache:
  neo4j-data:
